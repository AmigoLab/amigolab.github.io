{{/* JSON-LD Organization - Enhanced for SEO */}}
{{- $sharing_image := resources.GetMatch (path.Join "media" "sharing.*") -}}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": {{ site.Params.marketing.seo.site_type | default "Organization" }},
  "@id": {{ site.BaseURL }},
  "name": {{ site.Params.marketing.seo.org_name | default site.Title }},
  "alternateName": "AMIGO",
  "description": {{ site.Params.marketing.seo.description | default "" }},
  "logo": {{ partial "blox-core/functions/get_logo_url" . }},
  {{with $sharing_image}}"image": {{.Permalink}},{{end}}
  "url": {{ site.BaseURL }},
  "sameAs": [
    "https://github.com/AmigoLab"
  ],
  {{ with site.Params.marketing.seo.address }}
  "address": {
    "@type": "PostalAddress",
    "streetAddress": {{ .street | default "" }},
    "addressLocality": {{ .city | default "" }},
    "addressRegion": {{ .region | default "" }},
    "postalCode": {{ .postcode | default "" }},
    "addressCountry": {{ .country_code | default .country | default "" }}
  },
  {{ end }}
  "parentOrganization": {
    "@type": "EducationalOrganization",
    "name": "King's College London",
    "url": "https://www.kcl.ac.uk"
  },
  "department": {
    "@type": "Organization",
    "name": "School of Biomedical Engineering and Imaging Sciences",
    "url": "https://www.kcl.ac.uk/bmeis"
  },
  "knowsAbout": [
    "Medical Artificial Intelligence",
    "Deep Learning",
    "Medical Image Analysis",
    "Clinical Decision Support",
    "Healthcare Analytics",
    "Neuroimaging"
  ]
}
</script>
