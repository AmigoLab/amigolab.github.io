<!-- Head partial override: force light mode only -->
<script>
  // Force light theme immediately before any other scripts
  (function() {
    // Clear any dark mode preference from localStorage
    try {
      localStorage.clear(); // Clear all to remove any theme preferences
      localStorage.setItem('theme', 'light');
      localStorage.setItem('hb-appearance', 'light');
    } catch (e) {
      /* ignore localStorage errors */
    }

    // Remove dark class immediately
    document.documentElement.classList.remove('dark');
    
    // Add light class
    document.documentElement.classList.add('light');
    
    // Set data attributes for light mode
    document.documentElement.setAttribute('data-mode', 'light');
    document.documentElement.setAttribute('data-theme', 'light');

    // Ensure wc object exists and force light theme
    window.wc = window.wc || {};
    window.wc.isSiteThemeDark = false;
    window.wc.darkLightEnabled = false;

    // Override any theme toggle functions
    window.toggleDarkLightMode = function() { return false; };
    window.wcThemeSwitcher = function() { return false; };
    
    // Monitor and prevent dark mode class from being added
    const forceLightMode = function() {
      document.documentElement.classList.remove('dark');
      document.documentElement.classList.add('light');
      if (document.body) {
        document.body.classList.remove('dark');
      }
    };
    
    // Force on load
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', forceLightMode);
    } else {
      forceLightMode();
    }
    
    // Keep forcing it
    setInterval(forceLightMode, 100);
    
    // Also use MutationObserver
    if (typeof MutationObserver !== 'undefined') {
      const observer = new MutationObserver(forceLightMode);
      observer.observe(document.documentElement, { 
        attributes: true, 
        attributeFilter: ['class', 'data-mode', 'data-theme'] 
      });
    }
  })();
</script>

<!-- Force light mode styles with highest specificity -->
<style>
  /* Force light mode color scheme */
  :root {
    color-scheme: light only !important;
  }
  
  html,
  html.light,
  html[data-mode="light"] {
    color-scheme: light only !important;
  }
  
  /* Override dark mode completely */
  html.dark,
  html[data-mode="dark"],
  body.dark {
    /* Don't hide, but override colors */
    background-color: #ffffff !important;
    color: #000000 !important;
  }
  
  /* Force light theme CSS variables */
  html,
  html.dark,
  html[data-mode="dark"] {
    --body-bg: #ffffff !important;
    --body-color: #000000 !important;
    --navbar-bg: #ffffff !important;
    --navbar-color: #000000 !important;
  }
  
  /* Ensure hero section backgrounds are handled */
  .home-section.dark,
  section.dark {
    background-color: inherit !important;
    color: inherit !important;
  }
</style>
